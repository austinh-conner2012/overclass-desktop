# Builds Overclass for Windows (.exe), Mac (.dmg) and Linux / Chromebook (.deb) on GitHub's own
# machines, and publishes them as a release. Push a tag like v1.0.1 (or run it by hand) to build.
name: Build desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: overclass-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: Overclass ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          make_latest: true
          files: out/*
          body: |
            **Windows:** download `Overclass-Setup.exe` and run it. Windows may say it "protected your PC" (the app isn't signed with a paid certificate) — click **More info → Run anyway**.

            **Mac:** download `Overclass-mac.dmg`, open it and drag Overclass into Applications. The first time, right-click the app and choose **Open** (or System Settings → Privacy & Security → **Open Anyway**).

            **Chromebook:** the easiest way is the **Install app** button in the game at https://xgameshq.com/portal-arena. Or turn on Linux (Settings → Advanced → Developers) and open `Overclass-linux-x64.deb` (or `-arm64.deb` on ARM Chromebooks) from your Files app.
